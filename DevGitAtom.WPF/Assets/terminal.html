<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d1117; overflow: hidden; }
  #terminal { width: 100%; height: 100%; }
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
<div id="terminal"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"></script>
<script>
const term = new Terminal({
  cursorBlink: true,
  fontSize: 13,
  fontFamily: "'Cascadia Code', 'Consolas', 'Courier New', monospace",
  theme: {
    background:  '#0d1117',
    foreground:  '#e6edf3',
    cursor:      '#58a6ff',
    black:       '#484f58',
    red:         '#ff7b72',
    green:       '#3fb950',
    yellow:      '#d29922',
    blue:        '#58a6ff',
    magenta:     '#bc8cff',
    cyan:        '#39c5cf',
    white:       '#b1bac4',
    brightBlack: '#6e7681',
    brightRed:   '#ffa198',
    brightGreen: '#56d364',
    brightYellow:'#e3b341',
    brightBlue:  '#79c0ff',
    brightMagenta:'#d2a8ff',
    brightCyan:  '#56d4dd',
    brightWhite: '#f0f6fc',
  },
  allowProposedApi: true,
});

const fitAddon = new FitAddon.FitAddon();
const webLinksAddon = new WebLinksAddon.WebLinksAddon();
term.loadAddon(fitAddon);
term.loadAddon(webLinksAddon);

// Handle Ctrl+C for copy if text is selected
term.attachCustomKeyEventHandler(e => {
  if (e.ctrlKey && e.code === 'KeyC' && e.type === 'keydown') {
    const selection = term.getSelection();
    if (selection) {
      navigator.clipboard.writeText(selection);
      return false; // Prevent default action (sending to shell)
    }
  }
  return true;
});

term.open(document.getElementById('terminal'));
fitAddon.fit();

// Resize observer
new ResizeObserver(() => fitAddon.fit()).observe(document.getElementById('terminal'));

// Write to terminal from C#
window.writeToTerminal = function(text) {
  term.write(text);
};

window.clearTerminal = function() {
  term.clear();
};

// Send user input to C#
let inputBuffer = '';
term.onData(data => {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage({ type: 'input', data: data });
  }
  // Echo for display
  if (data === '\r') {
    term.write('\r\n');
    inputBuffer = '';
  } else if (data === '\x7f') {
    if (inputBuffer.length > 0) {
      inputBuffer = inputBuffer.slice(0, -1);
      term.write('\b \b');
    }
  } else {
    inputBuffer += data;
    term.write(data);
  }
});

// Initial banner
term.writeln('\x1b[1;34m  dev-git-atom — Embedded Terminal\x1b[0m');
term.writeln('\x1b[2m  Chạy chain từ panel bên trái hoặc gõ lệnh git trực tiếp.\x1b[0m');
term.writeln('');
</script>
</body>
</html>
